# Weekly production-dependency audit for ui-antd — informational, never
# blocking (ADR 0007): failures open a ticket, not a red required check.
# Hoisted from ui-antd/.github/workflows/audit.yml (GitHub only executes
# workflows from the REPO ROOT .github/workflows/).

name: ui-antd audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: ui-antd

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui-antd/.nvmrc
          cache: npm
          cache-dependency-path: ui-antd/package-lock.json
      - run: npm ci
      - name: Audit production dependencies (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
