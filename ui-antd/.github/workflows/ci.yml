# ui-antd CI — three parallel, all-required jobs (biome / tsc+vitest / build).
#
# NOTE: GitHub only executes workflows from the REPO ROOT .github/workflows/.
# This monorepo keeps the frontend CI next to its package for now; hoist this
# file verbatim to <repo-root>/.github/workflows/ui-antd-ci.yml to activate it
# (working-directory and node-version-file below are already root-shaped).
# Branch protection must then mark all three jobs as required checks.
#
# vitest runs inside the typecheck job: it shares the same `npm ci` (the
# suite neither needs the build output nor a browser) and stays fast enough
# (~1 min) that a fourth install cycle is not worth it.

name: ui-antd CI

on:
  push:
    branches: [master, feature/**]
    paths: ['ui-antd/**']
  pull_request:
    paths: ['ui-antd/**']

defaults:
  run:
    working-directory: ui-antd

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui-antd/.nvmrc
          cache: npm
          cache-dependency-path: ui-antd/package-lock.json
      # Full `biome check` (formatter + linter + assist) — must NOT degrade
      # to `biome lint`.
      - run: npx biome check

  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui-antd/.nvmrc
          cache: npm
          cache-dependency-path: ui-antd/package-lock.json
      # `prepare` (max setup) runs on install and generates src/.umi, which
      # tsc depends on.
      - run: npm ci
      - run: npm run tsc
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui-antd/.nvmrc
          cache: npm
          cache-dependency-path: ui-antd/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
